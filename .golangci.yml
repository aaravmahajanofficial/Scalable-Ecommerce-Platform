run:
  timeout: 5m
  issues:
    exclude-dirs:
      - vendor
      - node_modules
  fast: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gocyclo
    - revive
    - gofmt
    - goimports
    - bodyclose
    - gosec
    - unused
    - nilnil

linters-settings:
  exhaustruct:
    exclude:
      - ".*_test\\.go"
      - "^testing\\.T$"
  errcheck:
    check-type-assertions: true
    check-blank: true
  staticcheck:
    checks: ["all", "-SA1019"]
  gocyclo:
    min-complexity: 20
  revive:
    rules:
      - name: var-naming
        severity: warning
      - name: empty-block
        severity: error
      - name: unused-parameter
        severity: warning
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - commentFormatting

issues:
  exclude-patterns:
    - ".*_generated\\.go"
    - ".*_test\\.go"
  exclude-rules:
    - path: "vendor/.*"
      linters:
        - all
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 10

output:
  formats:
    - format: colored-line-number
  sort-results: true
  print-issued-lines: true
  print-linter-name: true
