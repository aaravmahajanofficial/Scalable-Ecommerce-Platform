name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PRs for this commit
        env:
          GH_TOKEN: ${{ secrets.AUTOUPDATE_PAT }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for pr in $(gh pr list --repo "$REPO" --state open --search "$SHA" --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$REPO" --squash \
              || echo "::warning::#$pr not mergeable yet"
          done
