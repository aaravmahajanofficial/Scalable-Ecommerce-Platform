version: "2"

run:
  timeout: 5m
  go: "1.26.5"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gocyclo
    - revive
    - bodyclose
    - gosec
    - unused
    - nilnil
    - gofmt
    - goimports
    - gocritic

  settings:
    exhaustruct:
      exclude:
        - ".*_test\\.go"
        - "^testing\\.T$"

    errcheck:
      check-type-assertions: true
      check-blank: true

    staticcheck:
      checks:
        - all
        - "-SA1019"

    gocyclo:
      min-complexity: 20

    revive:
      rules:
        - name: var-naming
          severity: warning
        - name: empty-block
          severity: error
        - name: unused-parameter
          severity: warning

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting

  exclusions:
    paths:
      - "vendor/.*"
      - "node_modules/.*"
      - ".*_generated\\.go"
      - ".*_test\\.go"

    rules:
      - path: "vendor/.*"
        linters:
          - all

      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

output:
  formats:
    text:
      path: stdout
      colors: true

  sort-order:
    - linter
    - severity
    - file
