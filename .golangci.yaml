version: "2"

run:
  timeout: 5m
  go: "1.26.5"

linters:
  enable:
    # Correctness / static analysis
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - nilnil
    - unused
    - ineffassign
    - unconvert

    # Security / resource handling
    - gosec
    - bodyclose

    # Complexity / maintainability
    - gocyclo
    - gocognit
    - revive
    - gocritic

    # Modern Go
    - modernize
    - copyloopvar
    - intrange

    # Context / API correctness
    - noctx

    # Suppression hygiene
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    staticcheck:
      checks:
        - all

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 15

    revive:
      rules:
        - name: var-naming
          severity: warning
        - name: package-naming
          severity: warning
        - name: empty-block
          severity: error
        - name: unused-parameter
          severity: warning

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax

    paths:
      - "vendor/.*"
      - "node_modules/.*"

    rules:
      # Security checks in tests are often intentionally noisy.
      - path: "_test\\.go$"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-order:
    - linter
    - severity
    - file

formatters:
  enable:
    - gofmt
    - goimports
